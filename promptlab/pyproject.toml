[project]
name = "promptlab"
version = "0.1.0"
description = "A prompt experimentation lab for local language models."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "typer>=0.12",
    "rich>=13",
    "ai-workbench",
]

[project.scripts]
pl = "promptlab.cli:lab_app"

[tool.uv.sources]
ai-workbench = { path = "../ai-workbench", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptlab"]