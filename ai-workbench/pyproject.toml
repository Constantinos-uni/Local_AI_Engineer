[project]
name = "ai-workbench"
version = "0.1.0"
description = "A local-first AI engineering workbench"
readme = "README.md"
authors = [
    { name = "Constantinos-Vidiniotis", email = "kvidiniotis99@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "tiktoken>=0.14.0",
    "typer>=0.27.2",
]

[project.scripts]
wb = "ai_workbench.cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
